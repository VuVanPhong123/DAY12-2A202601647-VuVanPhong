name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run local tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >-
          python -m pytest tests/ --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py -m "not docker" -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag day12-agent:ci .

  deploy:
    name: Deploy to Railway when configured
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npx --yes @railway/cli up --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID"

      - name: Report missing deployment secret
        if: env.RAILWAY_TOKEN == ''
        run: echo "Deployment skipped; configure RAILWAY_TOKEN in GitHub Actions secrets."

      - name: Smoke test deployed service
        if: env.RAILWAY_TOKEN != '' && env.PUBLIC_URL != ''
        run: |
          sleep 45
          curl --fail --silent --show-error "$PUBLIC_URL/health"
